services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kerox
      MYSQL_USER: kerox
      MYSQL_PASSWORD: kerox
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ADR-048 — local dev's own Redis, now a real prerequisite of
  # `composer run dev` (QUEUE_CONNECTION=redis, backend/.env.example) since
  # Horizon requires it and has no `database`-driver fallback. Published on
  # the default port so `php artisan horizon`/`queue:listen` running
  # directly on the host (Herd, not inside a container) can reach it at
  # 127.0.0.1:6379 — same "runs outside Docker, Docker only backs the data
  # store" shape as the `mysql` service above. No AOF here (unlike
  # docker-compose.prod.yml's redis): a local dev Redis losing an
  # in-progress test job on restart is a non-event, not worth the disk
  # I/O trade-off in a throwaway local environment.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_data:
