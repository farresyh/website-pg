# ADR-020 Phase 1 — thin nginx in front of the php-fpm service (compose
# network name "php-fpm"), standard Laravel pattern. Publishes port 80 for
# the (deploy-time, host-level) droplet Nginx to reverse-proxy to —
# Cloudflare Origin CA/SSL termination itself stays out of scope here, see
# docker-compose.prod.yml's own comment.
#
# ADR-047 decision 5 — the /app/ location below reverse-proxies Reverb's
# WebSocket handshake through this same entry point (compose network name
# "reverb", port 8080 — Reverb's own default client path, unchanged, not a
# custom prefix). One TLS/domain surface for HTTP and WebSocket traffic
# alike; the droplet's host-level Nginx (ADR-020 decision #8) only ever
# needs to know about this one published port either way.

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
