# Production runtime stack (ADR-020 Phase 1 + its 2026-09-01 addendum).
# Distinct from backend/docker-compose.yml (ADR-010, local-dev-only real
# MySQL for the concurrency suite) — that file is untouched.
#
# Runs on the one DigitalOcean droplet (`topup-prod-sgp1`, 4 GiB / 2 vCPU,
# SGP1). Five services: nginx + php-fpm + horizon + redis + reverb.
#  - No `mysql` service: production DB is DigitalOcean Managed MySQL,
#    off-box (ADR-020 decision #2, tier cut to 1 GiB single-node by the
#    2026-09-01 addendum).
#  - No `admin`/`storefront`/`reseller` services: the three Next.js apps
#    moved to Vercel (ADR-020's 2026-09-01 addendum reverses decision #4)
#    — building 3 SSR apps on the box that serves checkout traffic was the
#    OOM-a-money-critical-process risk decision #5's queue split guards
#    against, one layer up.
#  - No object-storage service: DigitalOcean Spaces is external too.
#  - TLS: for the first launch the droplet's host-level nginx terminates
#    Let's Encrypt for `api.pekangame.space` and reverse-proxies to this
#    stack's `nginx` published port. Swaps to Cloudflare Origin CA + Proxy
#    after the domain moves off Vercel DNS (ADR-020 decision #8 / addendum).
#
# The three backend-image services (php-fpm / horizon / reverb) carry both
# `build:` (for `docker compose build` locally) and `image:` (for the CI
# `push:main` pipeline's registry pull-deploy). The deploy runs
# `IMAGE_TAG=<sha> docker compose pull && up -d --no-build`; a rollback
# re-runs `up -d` with the previous SHA. IMAGE_TAG defaults to `latest`.
# NGINX_PORT (this directory's own .env, not committed) lets the host-level
# nginx pick where to proxy; ADR-037's staging stack, if ever built, sets
# its own value.

x-backend-image: &backend-image
  build:
    context: ./backend
  image: registry.digitalocean.com/pekangame/backend:${IMAGE_TAG:-latest}

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - php-fpm
      - reverb
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  php-fpm:
    <<: *backend-image
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/public:/var/www/html/public:ro

  # ADR-048 decision 1/3 — Horizon is its own supervisor process:
  # config/horizon.php's supervisor-orders / supervisor-price-sync /
  # supervisor-backups keys preserve the exact per-queue isolation
  # (ADR-020 decision #5's head-of-line-blocking rationale) the three old
  # `queue:work` containers had. Scale a queue by raising that
  # supervisor's `maxProcesses` in config, not `docker compose --scale`.
  horizon:
    <<: *backend-image
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - ./backend/.env
    command: php artisan horizon
    # Laravel's recommended graceful-shutdown window — horizon:terminate
    # waits for each worker's current job to finish before exiting.
    stop_grace_period: 90s

  # ADR-048 decision 1/2 — QUEUE_CONNECTION is `redis` (backend/.env), so
  # this instance holds real non-regenerable job state (a queued
  # FulfillOrderJob for an already-paid order), not just regenerable
  # cache. AOF (`--appendonly yes`) is a hard prerequisite of that move,
  # not optional hardening — without it a Redis restart/OOM silently drops
  # unprocessed jobs. No published port — compose-network only.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  # ADR-047 decision 5 — Reverb's realtime WebSocket server. Same image as
  # php-fpm, only the command differs. No published port: browser traffic
  # reaches it via nginx's `/app/` reverse-proxy (one TLS/domain surface
  # for HTTP + WebSocket); php-fpm/horizon workers publish to it directly
  # over the compose network (REVERB_HOST=reverb in backend/.env).
  reverb:
    <<: *backend-image
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: php artisan reverb:start --host=0.0.0.0

volumes:
  # ADR-048 decision 2 — AOF persistence needs a durable mount, not the
  # container's own writable layer (a `compose down` / image rebuild
  # discards that along with any unprocessed queue jobs).
  redis-data:
