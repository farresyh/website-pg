# ADR-020 Phase 1 — production runtime stack. Distinct from
# backend/docker-compose.yml (ADR-010, local-dev-only real MySQL for the
# concurrency test suite) — that file is untouched and unrelated to this one.
#
# No `mysql` service: production DB is DigitalOcean Managed MySQL, off-box
# (ADR-020 decision #2). No object-storage service: DigitalOcean Spaces is
# external too. Cloudflare Origin CA/SSL termination happens on the
# droplet's own host-level Nginx (ADR-020 decision #8) reverse-proxying to
# this stack's `nginx` service's published port — not configured here,
# since it needs the real droplet's filesystem to set up.
#
# ADR-037 — this same file is deployed twice on the same droplet (once for
# production, once for staging), each from its own directory checkout with
# its own .env/.env.local files. NGINX_PORT/ADMIN_PORT/STOREFRONT_PORT
# (this directory's own .env, same convention as NEXT_PUBLIC_API_URL below
# — not committed) let the two deployments bind different host ports;
# container/network names already isolate via `docker compose -p <project>`.
# Unset, all three default to production's original values.

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - php-fpm
      - reverb
    # Parameterized (ADR-037 decision #6) so a staging deploy of this same
    # file, in its own directory checkout on the same droplet, can bind
    # different host ports and coexist with production — container/network
    # names already isolate for free via `docker compose -p <project>`.
    # Defaults match production's original fixed ports unchanged.
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  php-fpm:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/public:/var/www/html/public:ro

  # ADR-020 decision #5 — split by queue so a slow SyncSupplierPricesJob
  # run (queue `price-sync`) can never head-of-line-block an urgent
  # FulfillOrderJob/ResendOrderDeliveryJob (queue `orders`). Flags per this
  # session's own research against Laravel's official queue:work docs.
  # 1 process each for now (zero real traffic today, per ADR-021) — scale
  # `queue-worker-orders` via `docker compose up -d --scale
  # queue-worker-orders=2` once real order volume justifies it, no code
  # change needed to do that.
  queue-worker-orders:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: php artisan queue:work --queue=orders --tries=3 --sleep=3 --max-jobs=1000 --max-time=3600

  queue-worker-price-sync:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: php artisan queue:work --queue=price-sync --tries=1 --sleep=3 --max-jobs=1000 --max-time=3600

  # ADR-039 — RunDatabaseBackupJob's own queue, same head-of-line-blocking
  # rationale as the two workers above: a slow dump+restore-test cycle
  # must never sit behind (or delay) an urgent order/price-sync job, and
  # vice versa.
  queue-worker-backups:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: php artisan queue:work --queue=backups --tries=1 --sleep=3 --max-jobs=1000 --max-time=3600

  # NEXT_PUBLIC_API_URL is the one env var both Next.js apps actually read
  # (grep-confirmed) — passed as a build arg since it's inlined into the
  # client bundle at build time, not read at container-start (see each
  # Dockerfile's own comment). Compose reads it from a `.env` file in this
  # same directory (Docker Compose's own convention, distinct from
  # backend/admin/storefront's own .env.local files) — not committed here.
  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        # ADR-047 decision 1/3/5 — same Reverb build-arg wiring as
        # storefront below (Price Sync/Backups' private channels).
        NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY}
        NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST}
        NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT:-443}
        NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME:-https}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    env_file:
      - ./admin/.env.local

  storefront:
    build:
      context: ./storefront
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        # ADR-047 decision 1/5 — public-facing Reverb connection details
        # (through nginx's /app/ proxy + Cloudflare, not the internal
        # compose-network `reverb` hostname `php-fpm`/queue workers use).
        # Read from this directory's own .env, same convention as
        # NEXT_PUBLIC_API_URL above.
        NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY}
        NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST}
        NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT:-443}
        NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME:-https}
    restart: unless-stopped
    ports:
      - "${STOREFRONT_PORT:-3001}:3000"
    env_file:
      - ./storefront/.env.local

  # ADR-020 decision #3 — cache-only, never the queue driver (queue stays
  # on the `database` driver, per ADR-014 decision #1, now backed by
  # Managed MySQL). No published port — only reachable over the compose
  # network.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no

  # ADR-047 decision 5 — Reverb's own realtime WebSocket server, same
  # image/build as php-fpm (only the command differs, same pattern as the
  # queue-worker-* services above). No published port: browser traffic
  # reaches it only via `nginx`'s `/app/` reverse-proxy below (one TLS/
  # domain surface for HTTP and WebSocket alike); `php-fpm`/the
  # queue-worker-* containers publish events to it directly over the
  # compose network (REVERB_HOST=reverb in backend/.env), never through
  # nginx either.
  reverb:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: php artisan reverb:start --host=0.0.0.0
