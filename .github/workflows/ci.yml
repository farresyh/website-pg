# ADR-066 (reverses ADR-020 decision #9's image-pipeline half) + ADR-037's
# addendum (single-env, deploy from `main`). Pipeline on `push:main`:
#   backend / concurrency / frontend tests  →  deploy (POST to Forge's
#   deploy webhook — Forge pulls `main`, runs composer install + migrate
#   --force + cache + horizon:terminate, then health-checks `/up` and
#   fails the deployment on a bad check).
#
# The backend runs on a Laravel Forge-managed droplet now — no Docker
# image, no DO Container Registry, no SSH key in CI. The 3 Next.js apps
# deploy on Vercel off the same `main` push. `deploy` needs one repo
# secret, FORGE_DEPLOY_HOOK; until it exists that job fails at the curl
# step and the test jobs above it are unaffected. Forge "Quick Deploy" is
# OFF so a push only deploys after this CI gate is green.
#
# CI-minute controls (ADR-066 addendum, 2026-09-07 — private repo, billed
# minutes; ~135 runs/7d was burning ~1900 min/mo):
#   - `concurrency` cancels a superseded PR run when a newer commit is
#     pushed to the same PR (was paying 2x for every quick re-push). NOT
#     applied to `push:main` — a deploy run must always finish.
#   - `pull_request.paths-ignore` skips the whole matrix for a docs-only
#     PR (no code depends on `docs/**` or any `*.md`). A `push:main` stays
#     unfiltered so a docs merge still triggers `deploy` (harmless no-op).
#   No branch protection / rulesets exist on `staging`/`main` today, so a
#   skipped run does not wedge a "required check never reported" merge.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# One in-flight run per PR (or per branch/ref for a push); a newer commit
# cancels the older PR run. `push:main` is never cancelled — `deploy`
# depends on it completing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - run: composer install --no-progress --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test

  # This is the mechanism that already caught the MySQL 64-char
  # identifier-length bug twice (ADR-021 addendum, docs/adr.md) — running
  # it on every push is the permanent guardrail against a 3rd instance,
  # which is why this session deliberately didn't build a separate
  # bespoke static-analysis test for the same thing.
  backend-concurrency:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kerox
          MYSQL_USER: kerox
          MYSQL_PASSWORD: kerox
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - run: composer install --no-progress --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test -c phpunit.concurrency.xml

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx eslint .

  storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: storefront/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx eslint .

  # ADR-059 — the reseller portal (third Next.js app). Same tsc/build/lint
  # gate as admin and storefront.
  reseller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reseller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: reseller/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx eslint .

  # ADR-084 PR-4 — the Reseller API docs site (4th Next-less frontend:
  # Astro + Starlight). Same build/check gate as the other frontends.
  # Versions are pinned exact in docs-site/package.json.
  docs-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # ADR-084 PR-4 decision 7 (the ADR-033 lesson) — the committed
  # docs-site/public/openapi.json must never drift from what the backend's
  # Scramble annotations actually produce. Regenerate it and fail on any
  # diff. `--no-ansi --silent` + `--path` (not command substitution) dodges
  # the GITHUB_ACTIONS ANSI-injection gotcha (repo-root AGENTS.md).
  scramble-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - run: composer install --no-progress --prefer-dist
        working-directory: backend
      - run: cp .env.example .env
        working-directory: backend
      - run: php artisan key:generate
        working-directory: backend
      # sqlite + migrations: Scramble infers nullability of response
      # fields from the real schema (e.g. games.reseller_code,
      # orders.server_id are nullable), so the export must run against a
      # migrated DB to match how the committed spec was generated.
      - run: touch database/database.sqlite
        working-directory: backend
      - run: DB_CONNECTION=sqlite DB_DATABASE=database/database.sqlite php artisan migrate --force
        working-directory: backend
      - run: DB_CONNECTION=sqlite DB_DATABASE=database/database.sqlite php artisan scramble:clear && DB_CONNECTION=sqlite DB_DATABASE=database/database.sqlite php artisan scramble:export --path=../docs-site/public/openapi.json --no-ansi --silent
        working-directory: backend
      - name: Fail if the committed spec is stale
        run: |
          if ! git diff --exit-code -- docs-site/public/openapi.json; then
            echo "::error::docs-site/public/openapi.json is stale. Run: cd backend && php artisan scramble:clear && php artisan scramble:export --path=../docs-site/public/openapi.json --no-ansi --silent"
            exit 1
          fi

  # ADR-023 — the 3 golden-path tests only (guest checkout->payment->
  # order status; admin login->Resend Delivery; admin login->Issue
  # Voucher), Chromium only. Both the supplier layer (Gamevion) and the
  # payment layer (CHIP) are faked unconditionally when APP_ENV=e2e
  # (AppServiceProvider::register() — ADR-022's 2026-09-01 addendum
  # moved payment onto the same fake-for-e2e footing as the supplier
  # layer), so this job needs no external secret at all. Deliberately
  # absent from build-and-push's own `needs:` list — ADR-020 decision #9
  # explicitly does not require Playwright to gate a deploy, since
  # Phase 1's existing test gate (backend tests, concurrency proofs) is
  # already strong; this job surfaces regressions without blocking
  # shipping on it.
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - run: composer install --no-progress --prefer-dist
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: admin
      - run: npm ci
        working-directory: storefront
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install chromium --with-deps
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  # ADR-066 — automatic, no manual approval gate (the test jobs are the
  # gate). POSTs to Forge's per-site deploy webhook; Forge then runs the
  # site's deploy script on the droplet (git pull → composer install →
  # `migrate --force`, never migrate:fresh → config/route/event:cache →
  # storage:link → horizon:terminate → nginx reload → curl `/up`). A bad
  # deploy or migration fails the curl at the end of Forge's own script,
  # which marks the Forge deployment failed and fires Forge's
  # deployment-failed notification; recovery is a manual
  # `php artisan migrate:rollback` + redeploy. `--fail-with-body` so a
  # non-2xx from Forge fails this job while still printing Forge's
  # response body. NOTE: `--fail-with-body` is mutually exclusive with
  # `-f`/`--fail` — curl rejects `-f … --fail-with-body` outright
  # ("option --fail-with-body: is badly used here"), which is why the
  # flag here is `-sS`, not `-fsS` (the `-f` form silently failed every
  # `main` deploy from the Forge cutover until 2026-09-02).
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [backend-tests, backend-concurrency, admin, storefront, reseller, docs-site, scramble-drift]
    runs-on: ubuntu-latest
    steps:
      - run: curl -sS --fail-with-body --max-time 30 -X POST "${{ secrets.FORGE_DEPLOY_HOOK }}"
