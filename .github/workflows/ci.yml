# ADR-020 Phase 1 (decision #9) — Phase 1 only. The SSH-deploy job
# (docker compose pull && up -d, migrate, GET /api/health rollback check)
# is deliberately NOT included here — it needs a real droplet IP/SSH key
# that don't exist yet (ADR-020 decision #10). Add it once those exist,
# rather than committing a stub job that can't run.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - run: composer install --no-progress --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test

  # This is the mechanism that already caught the MySQL 64-char
  # identifier-length bug twice (ADR-021 addendum, docs/adr.md) — running
  # it on every push is the permanent guardrail against a 3rd instance,
  # which is why this session deliberately didn't build a separate
  # bespoke static-analysis test for the same thing.
  backend-concurrency:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kerox
          MYSQL_USER: kerox
          MYSQL_PASSWORD: kerox
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - run: composer install --no-progress --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test -c phpunit.concurrency.xml

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx eslint .

  storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: storefront/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx eslint .

  # ADR-023 — the 3 golden-path tests only (guest checkout->payment->
  # order status; admin login->Resend Delivery; admin login->Issue
  # Voucher), Chromium only. Gamevion is faked unconditionally
  # (APP_ENV=e2e, AppServiceProvider::register()) — no secret needed
  # for that. Xendit is hit for real against its own working sandbox
  # (decision #6) and needs a real test-mode key: XENDIT_TEST_SECRET_KEY
  # is NOT yet added as a repo secret — until it is, this job passes
  # the 2 admin specs and fails only the checkout spec at the real
  # Xendit API call, the same "structurally complete, blocked on an
  # unprovisioned secret" gap this file's own build-and-push job below
  # already carries for DIGITALOCEAN_ACCESS_TOKEN. Deliberately absent
  # from build-and-push's own `needs:` list — ADR-020 decision #9
  # explicitly does not require Playwright to gate a deploy, since
  # Phase 1's existing test gate (396+ backend tests, concurrency
  # proofs) is already strong; this job surfaces regressions without
  # blocking shipping on it.
  playwright:
    runs-on: ubuntu-latest
    env:
      XENDIT_SECRET_KEY: ${{ secrets.XENDIT_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - run: composer install --no-progress --prefer-dist
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: admin
      - run: npm ci
        working-directory: storefront
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install chromium --with-deps
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  # Needs DIGITALOCEAN_ACCESS_TOKEN (repo secret) and a real DO Container
  # Registry to already exist — neither is provisioned yet. This job is
  # structurally complete but will fail at the doctl auth step until both
  # exist; that's an explicit, separate action, not part of this pass.
  build-and-push:
    if: github.ref == 'refs/heads/main'
    needs: [backend-tests, backend-concurrency, admin, storefront]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - run: doctl registry login --expiry-seconds 600
      - run: docker build -t registry.digitalocean.com/kedairuncitsoloz/backend:${{ github.sha }} ./backend
      - run: docker build --build-arg NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }} -t registry.digitalocean.com/kedairuncitsoloz/admin:${{ github.sha }} ./admin
      - run: docker build --build-arg NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }} -t registry.digitalocean.com/kedairuncitsoloz/storefront:${{ github.sha }} ./storefront
      - run: docker push registry.digitalocean.com/kedairuncitsoloz/backend:${{ github.sha }}
      - run: docker push registry.digitalocean.com/kedairuncitsoloz/admin:${{ github.sha }}
      - run: docker push registry.digitalocean.com/kedairuncitsoloz/storefront:${{ github.sha }}
