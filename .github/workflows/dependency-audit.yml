# Weekly dependency audit (2026-10-17). Checks every lockfile against the
# public advisory databases (composer audit, npm audit). Alert only: it
# never upgrades anything and is not part of the CI deploy gate, so a
# fresh advisory can't block a release. A failed scheduled run emails the
# account that last edited this file's cron (GitHub's default); the fix is
# a targeted upgrade on a fix/* branch, same as PR #474.
#
# Also runs on a PR that touches a lockfile, so an upgrade PR shows its
# own audit result. The schedule runs from the default branch (`main`).

name: Dependency audit

on:
  schedule:
    - cron: "0 1 * * 1" # Monday 01:00 UTC = 09:00 MYT
  workflow_dispatch:
  pull_request:
    paths:
      - "**/composer.lock"
      - "**/package-lock.json"
      - ".github/workflows/dependency-audit.yml"

jobs:
  composer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      # Reads composer.lock only, no install needed. Every severity fails:
      # advisories can arrive unrated (CVE-2026-108082 did).
      - run: composer audit --locked

  npm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: backend, level: moderate }
          - { app: admin, level: moderate }
          - { app: storefront, level: moderate }
          - { app: reseller, level: moderate }
          # Static docs, build-time only. A moderate in Starlight's
          # expressive-code chain has no non-downgrade fix (build log,
          # 2026-10-17); `high` avoids a weekly false alarm.
          - { app: docs-site, level: high }
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Reads package-lock.json only; runtime deps (devDependencies ship in no bundle).
      - run: npm audit --omit=dev --audit-level=${{ matrix.level }}
